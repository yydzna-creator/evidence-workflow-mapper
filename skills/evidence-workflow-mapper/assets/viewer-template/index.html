<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidence Workflow Notebook</title>
  <style>
    :root {
      color-scheme: light;
      --app-bg: #e9edf2;
      --chrome: #f7f8fa;
      --surface: #ffffff;
      --paper: #fffef9;
      --ink: #1d2733;
      --muted: #657180;
      --line: #d9dee5;
      --primary: #315cdd;
      --primary-soft: #e8edff;
      --accent: #d66a3c;
      --shadow: 0 12px 34px rgba(33, 42, 54, .14);
      --radius: 12px;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--app-bg); color: var(--ink); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, [contenteditable="true"]:focus-visible {
      outline: 3px solid rgba(49, 92, 221, .3);
      outline-offset: 2px;
    }
    .app { height: 100%; display: grid; grid-template-rows: 58px minmax(0, 1fr); }
    .topbar {
      display: flex; align-items: center; gap: 14px; padding: 0 16px;
      background: rgba(247, 248, 250, .96); border-bottom: 1px solid var(--line); z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 250px; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--primary); color: white; font-weight: 700; }
    .brand strong { display: block; font-size: 14px; font-weight: 650; }
    .brand small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .toolbar { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; }
    .tool-group { display: flex; align-items: center; gap: 4px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); }
    .tool, .action {
      border: 1px solid transparent; background: transparent; color: var(--ink); border-radius: 8px;
      min-height: 36px; padding: 7px 10px; font-size: 13px;
    }
    .tool:hover, .action:hover { background: #eceff3; }
    .tool[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); border-color: #cbd6ff; }
    .action { border-color: var(--line); background: var(--surface); }
    .action.primary { background: var(--primary); color: white; border-color: var(--primary); }
    .spacer { flex: 1; }
    .zoom-value { min-width: 44px; text-align: center; color: var(--muted); font-size: 12px; }
    .shell { min-height: 0; display: grid; grid-template-columns: 216px minmax(0, 1fr) auto; }
    .pages {
      min-height: 0; overflow: auto; background: var(--chrome); border-right: 1px solid var(--line); padding: 14px 12px 24px;
    }
    .side-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 10px; }
    .side-heading h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
    .page-thumb {
      width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px;
      padding: 8px; margin: 0 0 7px; color: var(--ink);
    }
    .page-thumb:hover { background: #eef1f5; }
    .page-thumb[aria-current="page"] { background: var(--primary-soft); border-color: #c7d3ff; }
    .thumb-sheet {
      height: 86px; border-radius: 6px; border: 1px solid #d8d4c8; background: var(--paper); margin-bottom: 7px;
      padding: 10px; display: flex; gap: 5px; align-items: center; overflow: hidden;
    }
    .thumb-line { height: 7px; flex: 1; border-radius: 2px; background: #d8dfef; }
    .thumb-line:nth-child(2) { background: #b9c7eb; }
    .thumb-line:nth-child(3) { background: #e2c4b6; }
    .page-thumb strong { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-thumb small { color: var(--muted); font-size: 11px; }
    .workspace { min-width: 0; min-height: 0; overflow: auto; padding: 28px 34px 60px; position: relative; }
    .paper-wrap { margin: 0 auto; transform-origin: top left; }
    .paper {
      width: 1260px; height: 860px; position: relative; overflow: hidden; background: var(--paper);
      box-shadow: var(--shadow); border-radius: 4px;
      background-image: linear-gradient(rgba(91, 113, 142, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(91, 113, 142, .05) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .paper-header { position: absolute; left: 54px; top: 36px; right: 54px; z-index: 4; pointer-events: none; }
    .paper-kicker { color: var(--primary); font-size: 12px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .paper-title { font-family: Georgia, "Microsoft YaHei", serif; font-size: 30px; font-weight: 600; margin: 8px 0 6px; }
    .paper-summary { max-width: 820px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .world { position: absolute; inset: 0; }
    .edge-layer { position: absolute; inset: 0; width: 1260px; height: 860px; pointer-events: none; z-index: 1; }
    .nodes-layer { position: absolute; inset: 0; z-index: 2; }
    .workflow-node {
      position: absolute; width: 260px; min-height: 132px; padding: 14px 15px; border-radius: 12px;
      background: rgba(255, 255, 255, .96); border: 1px solid #d7dde7; box-shadow: 0 5px 13px rgba(35, 45, 61, .1);
      user-select: none; touch-action: none;
    }
    .workflow-node:hover { border-color: #aab8dc; }
    .workflow-node.selected { border: 2px solid var(--primary); box-shadow: 0 0 0 5px rgba(49, 92, 221, .11); }
    .workflow-node.source-hit { border-color: var(--accent); box-shadow: 0 0 0 5px rgba(214, 106, 60, .13); }
    .node-number { color: var(--primary); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .workflow-node h3 { margin: 5px 0 6px; font-size: 16px; font-weight: 650; }
    .workflow-node p { color: var(--muted); font-size: 12px; line-height: 1.45; margin: 0 0 10px; }
    .node-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: #4f5b69; }
    .algorithm { max-width: 165px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #f0f2f6; padding: 3px 7px; border-radius: 99px; }
    .source-count { margin-left: auto; color: var(--accent); font-weight: 650; }
    .ink-canvas { position: absolute; inset: 0; width: 1260px; height: 860px; z-index: 6; pointer-events: none; touch-action: none; }
    .ink-canvas.active { pointer-events: auto; cursor: crosshair; }
    .stickies-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .sticky {
      position: absolute; width: 190px; min-height: 120px; padding: 24px 14px 14px; background: #fff0a8; color: #3f3927;
      box-shadow: 0 7px 16px rgba(59, 50, 23, .18); transform: rotate(-1deg); pointer-events: auto; touch-action: none;
    }
    .sticky::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 18px; background: rgba(255,255,255,.2); }
    .sticky-text { min-height: 75px; outline: none; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .sticky-delete { position: absolute; right: 5px; top: 2px; border: 0; background: transparent; font-size: 14px; color: #685f3a; }
    .overview-board { position: absolute; left: 58px; right: 58px; top: 150px; bottom: 54px; z-index: 2; display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; align-content: start; }
    .overview-card { background: rgba(255,255,255,.82); border-left: 5px solid var(--primary); padding: 20px 22px; min-height: 150px; }
    .overview-card.paper-specific { border-left-color: var(--accent); }
    .overview-card h3 { margin: 0 0 8px; font-size: 18px; }
    .overview-card p { margin: 0 0 12px; color: var(--muted); line-height: 1.55; font-size: 13px; }
    .overview-card button { border: 0; background: transparent; color: var(--primary); padding: 0; font-weight: 650; }
    .blank-page-message { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; z-index: 1; }
    .blank-page-message strong { display: block; color: var(--ink); font-family: Georgia, serif; font-size: 25px; margin-bottom: 8px; }
    .step-inspector {
      position: absolute; right: 28px; bottom: 26px; width: 355px; max-height: 310px; overflow: auto; z-index: 10;
      background: rgba(255,255,255,.97); border: 1px solid #d6dce5; box-shadow: 0 10px 24px rgba(31, 40, 55, .16); padding: 18px; border-radius: 12px;
    }
    .step-inspector[hidden] { display: none; }
    .step-inspector h3 { margin: 0 0 7px; font-size: 17px; }
    .step-inspector p { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .inspector-row { border-top: 1px solid var(--line); padding: 10px 0 2px; font-size: 12px; }
    .inspector-row button { border: 0; background: transparent; color: var(--primary); padding: 2px 0; text-align: left; }
    .papers { min-height: 0; width: 92px; display: grid; grid-template-columns: 92px 0; background: var(--chrome); border-left: 1px solid var(--line); transition: width .2s ease, grid-template-columns .2s ease; position: relative; z-index: 20; }
    .papers.open { width: 390px; grid-template-columns: 92px 298px; }
    .paper-tabs { min-height: 0; overflow: auto; padding: 9px 8px 18px; border-right: 1px solid var(--line); }
    .papers-label { font-size: 10px; color: var(--muted); text-align: center; letter-spacing: .08em; margin: 3px 0 8px; }
    .paper-tab {
      width: 74px; min-height: 68px; border: 1px solid #d9dee5; border-radius: 8px; background: var(--surface);
      margin: 0 0 7px; padding: 7px 6px; text-align: left; color: var(--ink);
    }
    .paper-tab:hover { border-color: #aab6c7; }
    .paper-tab[aria-selected="true"] { border: 2px solid var(--accent); background: #fff7f1; }
    .paper-tab .paper-index { font-size: 10px; color: var(--accent); font-weight: 700; }
    .paper-tab strong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 10px; line-height: 1.25; margin: 4px 0; }
    .paper-tab small { color: var(--muted); font-size: 9px; }
    .paper-detail { min-width: 0; overflow: auto; padding: 16px 16px 30px; background: var(--surface); }
    .paper-detail[aria-hidden="true"] { visibility: hidden; }
    .detail-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 13px; }
    .detail-top strong { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .icon-button { border: 0; background: transparent; border-radius: 6px; min-width: 32px; min-height: 32px; }
    .icon-button:hover { background: #eef1f5; }
    .paper-search { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; }
    .paper-detail h2 { font-family: Georgia, "Microsoft YaHei", serif; font-size: 19px; line-height: 1.35; margin: 7px 0 10px; }
    .source-meta { color: var(--muted); font-size: 12px; line-height: 1.55; margin-bottom: 14px; }
    .source-link { color: var(--primary); font-size: 12px; overflow-wrap: anywhere; }
    .mapping-title { margin: 20px 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
    .mapping { border-top: 1px solid var(--line); padding: 11px 0; }
    .mapping button { border: 0; background: transparent; color: var(--primary); padding: 0; text-align: left; font-weight: 650; }
    .mapping p { margin: 6px 0; color: #4f5a66; font-size: 12px; line-height: 1.5; }
    .mapping small { color: var(--muted); font-size: 11px; }
    .empty-detail { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80; background: #202936; color: white; border-radius: 9px; padding: 10px 15px; font-size: 12px; box-shadow: var(--shadow); }
    .toast[hidden] { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 980px) {
      .shell { grid-template-columns: 150px minmax(0, 1fr) auto; }
      .pages { padding-inline: 8px; }
      .brand small, .tool .long-label { display: none; }
      .brand { min-width: 190px; }
      .papers.open { width: 330px; grid-template-columns: 82px 248px; }
      .papers { width: 82px; grid-template-columns: 82px 0; }
      .paper-tab { width: 64px; }
    }
    @media (max-width: 720px) {
      .brand { min-width: auto; }
      .brand-text { display: none; }
      .topbar { gap: 6px; padding-inline: 8px; }
      .tool, .action { padding-inline: 8px; }
      .shell { grid-template-columns: 0 minmax(0, 1fr) auto; }
      .pages { display: none; }
      .workspace { padding: 18px; }
      .papers.open { position: absolute; right: 0; top: 58px; bottom: 0; width: min(390px, 94vw); grid-template-columns: 82px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">W</span>
        <span class="brand-text"><strong id="project-title">Evidence Workflow Notebook</strong><small>论文 × 流程 × 手写批注</small></span>
      </div>
      <nav class="toolbar" aria-label="笔记工具">
        <div class="tool-group" aria-label="批注工具">
          <button class="tool" type="button" data-tool="select" aria-pressed="true">选择</button>
          <button class="tool" type="button" data-tool="pen" aria-pressed="false">画笔</button>
          <button class="tool" type="button" data-tool="highlighter" aria-pressed="false">荧光笔</button>
          <button class="tool" type="button" data-tool="eraser" aria-pressed="false">橡皮</button>
          <button class="tool" type="button" data-tool="sticky" aria-pressed="false">便签</button>
        </div>
        <div class="tool-group" aria-label="缩放">
          <button class="tool" id="zoom-out" type="button" aria-label="缩小">−</button>
          <span class="zoom-value" id="zoom-value">100%</span>
          <button class="tool" id="zoom-in" type="button" aria-label="放大">＋</button>
          <button class="tool" id="zoom-fit" type="button">适合</button>
        </div>
        <span class="spacer"></span>
        <input class="sr-only" id="import-research" type="file" accept=".json" multiple>
        <label class="action" for="import-research">导入研究包</label>
        <button class="action primary" id="export-notebook" type="button">导出笔记</button>
      </nav>
    </header>

    <main class="shell">
      <aside class="pages" aria-label="笔记页">
        <div class="side-heading"><h2>笔记页</h2><span id="page-count"></span></div>
        <div id="page-list"></div>
      </aside>

      <section class="workspace" id="workspace" aria-label="研究笔记画布">
        <div class="paper-wrap" id="paper-wrap">
          <article class="paper" id="paper">
            <header class="paper-header" id="paper-header"></header>
            <div class="world" id="world">
              <svg class="edge-layer" id="edge-layer" viewBox="0 0 1260 860" role="img" aria-label="流程连接线"></svg>
              <div class="nodes-layer" id="nodes-layer"></div>
              <div class="stickies-layer" id="stickies-layer"></div>
              <canvas class="ink-canvas" id="ink-canvas" width="1260" height="860" aria-label="手写批注层"></canvas>
              <aside class="step-inspector" id="step-inspector" hidden></aside>
            </div>
          </article>
        </div>
      </section>

      <aside class="papers" id="papers" aria-label="论文与专利侧栏">
        <div class="paper-tabs">
          <div class="papers-label">论文架</div>
          <div id="paper-tabs"></div>
        </div>
        <section class="paper-detail" id="paper-detail" aria-hidden="true">
          <div class="detail-top"><strong>论文详情</strong><button class="icon-button" id="close-paper" type="button" aria-label="收起论文详情">×</button></div>
          <input class="paper-search" id="paper-search" type="search" placeholder="筛选论文 / 专利">
          <div id="source-detail" class="empty-detail">从右侧缩略论文中选择一篇。它只在这里展开，不会挤进主流程图。</div>
        </section>
      </aside>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    let workflowData = __WORKFLOW_DATA__;
    let sourceData = __SOURCES_DATA__;
    let annotationsData = __ANNOTATIONS_DATA__;
    let searchData = __SEARCH_DATA__;

    const PAPER_WIDTH = 1260;
    const PAPER_HEIGHT = 860;
    const dom = Object.fromEntries([
      "project-title", "page-list", "page-count", "workspace", "paper-wrap", "paper", "paper-header",
      "edge-layer", "nodes-layer", "stickies-layer", "ink-canvas", "step-inspector", "papers", "paper-tabs",
      "paper-detail", "paper-search", "source-detail", "close-paper", "zoom-value", "zoom-in", "zoom-out",
      "zoom-fit", "import-research", "export-notebook", "toast"
    ].map(id => [id.replaceAll("-", "_"), document.getElementById(id)]));

    const sourceById = new Map();
    const workflowById = new Map();
    const nodeById = new Map();
    let pages = [];
    let mappingsBySource = new Map();
    let state = createDefaultState();
    let currentPageId = "overview";
    let selectedSourceId = null;
    let selectedStepId = null;
    let tool = "select";
    let zoom = 1;
    let drawing = false;
    let currentStroke = null;
    let drag = null;
    let toastTimer = null;

    function createDefaultState() {
      return { schema_version: "1.0", project_id: workflowData?.project?.id || "project", layouts: {}, strokes: {}, stickies: {} };
    }

    function rebuildIndexes() {
      sourceById.clear(); workflowById.clear(); nodeById.clear(); mappingsBySource = new Map();
      for (const source of sourceData.sources || []) sourceById.set(source.id, source);
      for (const node of workflowData.nodes || []) nodeById.set(node.id, node);
      for (const workflow of workflowData.workflows || []) {
        workflowById.set(workflow.id, workflow);
        for (const step of workflow.steps || []) {
          for (const evidence of step.evidence || []) {
            if (!mappingsBySource.has(evidence.source_id)) mappingsBySource.set(evidence.source_id, []);
            mappingsBySource.get(evidence.source_id).push({ workflow, step, evidence, node: nodeById.get(step.node_id) });
          }
        }
      }
      pages = [
        { id: "overview", type: "overview", title: "研究总览", subtitle: `${workflowData.workflows?.length || 0} 条归一化流程` },
        ...(workflowData.workflows || []).map(w => ({ id: `workflow:${w.id}`, type: "workflow", workflow_id: w.id, title: w.title, subtitle: w.kind === "common" ? "通用流程" : "论文独立流程" })),
        { id: "notes", type: "notes", title: "自由笔记", subtitle: "手写与便签" }
      ];
      if (!pages.some(page => page.id === currentPageId)) currentPageId = "overview";
    }

    function loadStoredState() {
      const key = `ewm-notebook:${workflowData.project.id}`;
      try {
        const saved = JSON.parse(localStorage.getItem(key));
        if (saved && saved.project_id === workflowData.project.id) state = { ...createDefaultState(), ...saved };
        else state = createDefaultState();
      } catch { state = createDefaultState(); }
    }

    function persistState() {
      localStorage.setItem(`ewm-notebook:${workflowData.project.id}`, JSON.stringify(state));
    }

    function showToast(message) {
      clearTimeout(toastTimer); dom.toast.textContent = message; dom.toast.hidden = false;
      toastTimer = setTimeout(() => { dom.toast.hidden = true; }, 2300);
    }

    function renderNotebook() {
      dom.project_title.textContent = workflowData.project?.title || "Evidence Workflow Notebook";
      renderPageList(); renderNotebookPage(); renderPaperShelf(); applyZoom();
    }

    function renderPageList() {
      dom.page_count.textContent = pages.length;
      dom.page_list.replaceChildren(...pages.map((page, index) => {
        const button = document.createElement("button"); button.type = "button"; button.className = "page-thumb";
        button.setAttribute("aria-current", page.id === currentPageId ? "page" : "false");
        button.innerHTML = `<span class="thumb-sheet"><span class="thumb-line"></span><span class="thumb-line"></span><span class="thumb-line"></span></span><strong>${escapeHtml(page.title)}</strong><small>${index + 1} · ${escapeHtml(page.subtitle)}</small>`;
        button.addEventListener("click", () => { currentPageId = page.id; selectedStepId = null; renderNotebook(); });
        return button;
      }));
    }

    function renderNotebookPage() {
      const page = pages.find(item => item.id === currentPageId) || pages[0];
      dom.nodes_layer.innerHTML = ""; dom.edge_layer.innerHTML = ""; dom.step_inspector.hidden = true;
      dom.paper_header.innerHTML = `<div class="paper-kicker">${escapeHtml(page.subtitle)}</div><h1 class="paper-title">${escapeHtml(page.title)}</h1>`;
      if (page.type === "overview") renderOverviewPage();
      else if (page.type === "workflow") renderWorkflowPage(workflowById.get(page.workflow_id));
      else renderBlankPage();
      renderStickies(); drawStrokes(); highlightSourceNodes();
    }

    function renderOverviewPage() {
      dom.paper_header.innerHTML += `<p class="paper-summary">${escapeHtml(workflowData.project?.topic || "")}。这里是笔记本目录；每条通用流程和论文独立流程都有自己的纸面，论文证据统一收进右侧论文架。</p>`;
      const board = document.createElement("div"); board.className = "overview-board";
      for (const workflow of workflowData.workflows || []) {
        const category = (workflowData.categories || []).find(c => c.id === workflow.category_id);
        const card = document.createElement("section"); card.className = `overview-card ${workflow.kind === "paper-specific" ? "paper-specific" : ""}`;
        card.innerHTML = `<div class="paper-kicker">${escapeHtml(category?.title || workflow.kind)}</div><h3>${escapeHtml(workflow.title)}</h3><p>${escapeHtml(workflow.summary || "")}</p><button type="button">打开这页 →</button>`;
        card.querySelector("button").addEventListener("click", () => { currentPageId = `workflow:${workflow.id}`; renderNotebook(); });
        board.append(card);
      }
      dom.nodes_layer.append(board);
    }

    function renderWorkflowPage(workflow) {
      if (!workflow) return;
      const category = (workflowData.categories || []).find(c => c.id === workflow.category_id);
      dom.paper_header.innerHTML = `<div class="paper-kicker">${escapeHtml(category?.title || "流程")} · ${workflow.kind === "common" ? "通用流程" : "论文独立流程"}</div><h1 class="paper-title">${escapeHtml(workflow.title)}</h1><p class="paper-summary">${escapeHtml(workflow.summary || "")}</p>`;
      const positions = ensureLayout(workflow);
      for (const [index, step] of (workflow.steps || []).entries()) {
        const node = nodeById.get(step.node_id) || {};
        const el = document.createElement("article"); el.className = "workflow-node"; el.dataset.stepId = step.id;
        const pos = positions[step.id]; el.style.left = `${pos.x}px`; el.style.top = `${pos.y}px`;
        el.innerHTML = `<div class="node-number">STEP ${String(index + 1).padStart(2, "0")}</div><h3>${escapeHtml(node.title || step.node_id)}</h3><p>${escapeHtml(step.summary || node.summary || "")}</p><div class="node-meta"><span class="algorithm">${escapeHtml((step.algorithms || ["未记录算法"])[0])}</span><span class="source-count">${step.evidence?.length || 0} 篇证据</span></div>`;
        el.addEventListener("click", event => { if (!drag?.moved) selectStep(workflow, step); event.stopPropagation(); });
        el.addEventListener("pointerdown", event => startDragNode(event, workflow, step, el));
        dom.nodes_layer.append(el);
      }
      requestAnimationFrame(() => drawEdges(workflow));
    }

    function ensureLayout(workflow) {
      const saved = state.layouts[workflow.id] || {};
      const positions = {};
      (workflow.steps || []).forEach((step, index) => {
        positions[step.id] = saved[step.id] || { x: 70 + (index % 3) * 390, y: 200 + Math.floor(index / 3) * 245 };
      });
      state.layouts[workflow.id] = positions; return positions;
    }

    function drawEdges(workflow) {
      const defs = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8793a3"></path></marker></defs>`;
      const lines = (workflow.edges || []).map(edge => {
        const from = dom.nodes_layer.querySelector(`[data-step-id="${cssEscape(edge.from)}"]`);
        const to = dom.nodes_layer.querySelector(`[data-step-id="${cssEscape(edge.to)}"]`);
        if (!from || !to) return "";
        const x1 = from.offsetLeft + from.offsetWidth; const y1 = from.offsetTop + from.offsetHeight / 2;
        const x2 = to.offsetLeft; const y2 = to.offsetTop + to.offsetHeight / 2;
        const bend = Math.max(50, Math.abs(x2 - x1) / 2);
        return `<path d="M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#arrow)"/>`;
      }).join("");
      dom.edge_layer.innerHTML = defs + lines;
    }

    function renderBlankPage() {
      dom.paper_header.innerHTML += `<p class="paper-summary">这页不会被 skill 更新覆盖。你可以在这里画草图、写想法或放置便签。</p>`;
      dom.nodes_layer.innerHTML = `<div class="blank-page-message"><div><strong>空白研究页</strong>选择画笔、荧光笔或便签开始记录</div></div>`;
    }

    function selectStep(workflow, step) {
      selectedStepId = step.id;
      document.querySelectorAll(".workflow-node").forEach(el => el.classList.toggle("selected", el.dataset.stepId === step.id));
      const node = nodeById.get(step.node_id) || {};
      dom.step_inspector.hidden = false;
      dom.step_inspector.innerHTML = `<h3>${escapeHtml(node.title || step.node_id)}</h3><p>${escapeHtml(step.summary || node.summary || "")}</p><div class="node-meta">${(step.algorithms || []).map(a => `<span class="algorithm">${escapeHtml(a)}</span>`).join("")}</div>${(step.evidence || []).map(ev => `<div class="inspector-row"><button type="button" data-source="${escapeAttr(ev.source_id)}">${escapeHtml(sourceById.get(ev.source_id)?.title || ev.source_id)}</button><div>${escapeHtml(ev.contribution || "")}</div></div>`).join("")}`;
      dom.step_inspector.querySelectorAll("[data-source]").forEach(button => button.addEventListener("click", () => openSource(button.dataset.source)));
    }

    function renderPaperShelf() {
      const query = dom.paper_search.value.trim().toLocaleLowerCase();
      const sources = (sourceData.sources || []).filter(source => !query || `${source.title} ${source.year} ${(source.authors || []).join(" ")} ${source.publication_number || ""}`.toLocaleLowerCase().includes(query));
      dom.paper_tabs.replaceChildren(...sources.map((source, index) => {
        const button = document.createElement("button"); button.type = "button"; button.className = "paper-tab";
        button.setAttribute("aria-selected", source.id === selectedSourceId ? "true" : "false");
        const code = source.type === "patent" ? "PAT" : "PAPER";
        button.innerHTML = `<span class="paper-index">${code} ${String(index + 1).padStart(2, "0")}</span><strong>${escapeHtml(source.title)}</strong><small>${escapeHtml(String(source.year || "—"))}</small>`;
        button.addEventListener("click", () => openSource(source.id)); return button;
      }));
      renderSourceDetail();
    }

    function openSource(sourceId) {
      selectedSourceId = sourceId; dom.papers.classList.add("open"); dom.paper_detail.setAttribute("aria-hidden", "false");
      renderPaperShelf(); highlightSourceNodes();
    }

    function renderSourceDetail() {
      const source = sourceById.get(selectedSourceId);
      if (!source) return;
      const mappings = mappingsBySource.get(source.id) || [];
      const people = source.authors || source.inventors || [];
      dom.source_detail.innerHTML = `<div class="paper-kicker">${source.type === "patent" ? "专利" : "论文"} · ${escapeHtml(String(source.year || "年份未知"))}</div><h2>${escapeHtml(source.title)}</h2><div class="source-meta">${escapeHtml(people.join(", ") || "作者/发明人未记录")}<br>${escapeHtml(source.access_level || "")} · ${escapeHtml(source.verification_status || "")}</div>${source.url ? `<a class="source-link" href="${escapeAttr(source.url)}" target="_blank" rel="noreferrer">打开来源记录 ↗</a>` : ""}<h3 class="mapping-title">映射到 ${mappings.length} 个流程步骤</h3>${mappings.map(item => `<div class="mapping"><button type="button" data-workflow="${escapeAttr(item.workflow.id)}" data-step="${escapeAttr(item.step.id)}">${escapeHtml(item.node?.title || item.step.node_id)} →</button><p>${escapeHtml(item.evidence.contribution || "")}</p><small>${escapeHtml(item.evidence.algorithm || "未记录算法")} · ${escapeHtml(item.evidence.locator || "无定位")} · ${escapeHtml(item.evidence.original_term || "")}</small></div>`).join("") || `<p class="empty-detail">这篇来源尚未映射到流程节点。</p>`}`;
      dom.source_detail.querySelectorAll("[data-workflow]").forEach(button => button.addEventListener("click", () => jumpToMapping(button.dataset.workflow, button.dataset.step)));
    }

    function jumpToMapping(workflowId, stepId) {
      currentPageId = `workflow:${workflowId}`; selectedStepId = stepId; renderNotebook();
      const workflow = workflowById.get(workflowId); const step = workflow?.steps.find(item => item.id === stepId);
      if (workflow && step) selectStep(workflow, step);
    }

    function highlightSourceNodes() {
      const hitIds = new Set((mappingsBySource.get(selectedSourceId) || []).map(item => item.step.id));
      dom.nodes_layer.querySelectorAll(".workflow-node").forEach(el => el.classList.toggle("source-hit", hitIds.has(el.dataset.stepId)));
    }

    function renderStickies() {
      const stickies = state.stickies[currentPageId] || [];
      dom.stickies_layer.replaceChildren(...stickies.map(note => {
        const el = document.createElement("article"); el.className = "sticky"; el.dataset.noteId = note.id;
        el.style.left = `${note.x}px`; el.style.top = `${note.y}px`;
        el.innerHTML = `<button class="sticky-delete" type="button" aria-label="删除便签">×</button><div class="sticky-text" contenteditable="true" role="textbox" aria-label="便签内容">${escapeHtml(note.body || "写点什么…")}</div>`;
        el.querySelector(".sticky-delete").addEventListener("click", () => deleteSticky(note.id));
        el.querySelector(".sticky-text").addEventListener("input", event => { note.body = event.currentTarget.innerText; persistState(); });
        el.addEventListener("pointerdown", event => startDragSticky(event, note, el));
        return el;
      }));
    }

    function addSticky(x = 850, y = 240) {
      const notes = state.stickies[currentPageId] ||= [];
      notes.push({ id: `sticky-${Date.now()}`, x: Math.max(10, x - 95), y: Math.max(10, y - 25), body: "写点什么…" });
      persistState(); renderStickies(); setTool("select");
    }

    function deleteSticky(id) {
      state.stickies[currentPageId] = (state.stickies[currentPageId] || []).filter(note => note.id !== id);
      persistState(); renderStickies();
    }

    function startDragNode(event, workflow, step, el) {
      if (tool !== "select" || event.button !== 0) return;
      event.preventDefault(); el.setPointerCapture(event.pointerId);
      drag = { type: "node", moved: false, startX: event.clientX, startY: event.clientY, originX: el.offsetLeft, originY: el.offsetTop, workflow, step, el };
      el.addEventListener("pointermove", moveDrag); el.addEventListener("pointerup", endDrag, { once: true });
    }

    function startDragSticky(event, note, el) {
      if (tool !== "select" || event.target.closest("button") || event.target.isContentEditable) return;
      event.preventDefault(); el.setPointerCapture(event.pointerId);
      drag = { type: "sticky", moved: false, startX: event.clientX, startY: event.clientY, originX: note.x, originY: note.y, note, el };
      el.addEventListener("pointermove", moveDrag); el.addEventListener("pointerup", endDrag, { once: true });
    }

    function moveDrag(event) {
      if (!drag) return;
      const dx = (event.clientX - drag.startX) / zoom; const dy = (event.clientY - drag.startY) / zoom;
      drag.moved ||= Math.abs(dx) + Math.abs(dy) > 3;
      const maxX = PAPER_WIDTH - drag.el.offsetWidth; const maxY = PAPER_HEIGHT - drag.el.offsetHeight;
      const x = clamp(drag.originX + dx, 0, maxX); const y = clamp(drag.originY + dy, 0, maxY);
      drag.el.style.left = `${x}px`; drag.el.style.top = `${y}px`;
      if (drag.type === "node") { state.layouts[drag.workflow.id][drag.step.id] = { x, y }; drawEdges(drag.workflow); }
      else { drag.note.x = x; drag.note.y = y; }
    }

    function endDrag(event) {
      event.currentTarget.removeEventListener("pointermove", moveDrag); persistState();
      setTimeout(() => { drag = null; }, 0);
    }

    function setTool(next) {
      tool = next;
      document.querySelectorAll("[data-tool]").forEach(button => button.setAttribute("aria-pressed", button.dataset.tool === tool ? "true" : "false"));
      dom.ink_canvas.classList.toggle("active", ["pen", "highlighter", "eraser", "sticky"].includes(tool));
    }

    function pointOnPaper(event) {
      const rect = dom.paper.getBoundingClientRect();
      return { x: clamp((event.clientX - rect.left) / zoom, 0, PAPER_WIDTH), y: clamp((event.clientY - rect.top) / zoom, 0, PAPER_HEIGHT) };
    }

    function beginInk(event) {
      const point = pointOnPaper(event);
      if (tool === "sticky") { addSticky(point.x, point.y); return; }
      if (tool === "eraser") { eraseNear(point); return; }
      if (!['pen', 'highlighter'].includes(tool)) return;
      drawing = true; dom.ink_canvas.setPointerCapture(event.pointerId);
      currentStroke = { id: `stroke-${Date.now()}`, tool, color: tool === "pen" ? "#243247" : "#f1cf4a", width: tool === "pen" ? 3 : 18, points: [point] };
      (state.strokes[currentPageId] ||= []).push(currentStroke); drawStrokes();
    }

    function moveInk(event) {
      if (tool === "eraser" && event.buttons) { eraseNear(pointOnPaper(event)); return; }
      if (!drawing || !currentStroke) return;
      currentStroke.points.push(pointOnPaper(event)); drawStrokes();
    }

    function endInk() { if (drawing) persistState(); drawing = false; currentStroke = null; }

    function eraseNear(point) {
      const strokes = state.strokes[currentPageId] || [];
      state.strokes[currentPageId] = strokes.filter(stroke => !stroke.points.some(p => Math.hypot(p.x - point.x, p.y - point.y) < 24));
      persistState(); drawStrokes();
    }

    function drawStrokes() {
      const ctx = dom.ink_canvas.getContext("2d"); ctx.clearRect(0, 0, PAPER_WIDTH, PAPER_HEIGHT);
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (const stroke of state.strokes[currentPageId] || []) {
        if (!stroke.points.length) continue;
        ctx.beginPath(); ctx.globalAlpha = stroke.tool === "highlighter" ? .32 : .95; ctx.strokeStyle = stroke.color; ctx.lineWidth = stroke.width;
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (const point of stroke.points.slice(1)) ctx.lineTo(point.x, point.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function applyZoom() {
      dom.paper.style.transform = `scale(${zoom})`; dom.paper.style.transformOrigin = "top left";
      dom.paper_wrap.style.width = `${PAPER_WIDTH * zoom}px`; dom.paper_wrap.style.height = `${PAPER_HEIGHT * zoom}px`;
      dom.zoom_value.textContent = `${Math.round(zoom * 100)}%`;
    }

    function fitZoom() {
      zoom = clamp((dom.workspace.clientWidth - 70) / PAPER_WIDTH, .45, 1.15); applyZoom();
    }

    function exportNotebook() {
      const payload = { ...state, exported_at: new Date().toISOString(), annotations: annotationsData.annotations || [] };
      downloadJson(`${workflowData.project.id}-notebook.json`, payload); showToast("笔记已导出");
    }

    async function importResearch(files) {
      const parsed = {};
      for (const file of files) {
        try { parsed[file.name.toLowerCase()] = JSON.parse(await file.text()); }
        catch { showToast(`${file.name} 不是有效 JSON`); return; }
      }
      if (parsed["workflow.json"] && parsed["sources.json"]) {
        workflowData = parsed["workflow.json"]; sourceData = parsed["sources.json"];
        annotationsData = parsed["annotations.json"] || { schema_version: "1.0", project_id: workflowData.project.id, annotations: [] };
        searchData = parsed["search-log.json"] || { schema_version: "1.0", project_id: workflowData.project.id, searches: [] };
        state = createDefaultState(); loadStoredState(); currentPageId = "overview"; selectedSourceId = null;
        rebuildIndexes(); renderNotebook(); showToast("研究包已导入为新笔记本"); return;
      }
      const notebook = Object.values(parsed).find(value => value?.project_id && value?.layouts && value?.strokes);
      if (notebook && notebook.project_id === workflowData.project.id) {
        state = { ...createDefaultState(), ...notebook }; persistState(); renderNotebook(); showToast("笔记批注已导入");
      } else showToast("请选择 workflow.json 和 sources.json，或本项目的 notebook.json");
    }

    function downloadJson(filename, value) {
      const blob = new Blob([JSON.stringify(value, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob); const anchor = document.createElement("a"); anchor.href = url; anchor.download = filename; anchor.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]); }
    function escapeAttr(value) { return escapeHtml(value); }
    function cssEscape(value) { return window.CSS?.escape ? CSS.escape(value) : String(value).replace(/[^a-zA-Z0-9_-]/g, "\\$&"); }
    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

    document.querySelectorAll("[data-tool]").forEach(button => button.addEventListener("click", () => setTool(button.dataset.tool)));
    dom.zoom_in.addEventListener("click", () => { zoom = clamp(zoom + .1, .45, 1.6); applyZoom(); });
    dom.zoom_out.addEventListener("click", () => { zoom = clamp(zoom - .1, .45, 1.6); applyZoom(); });
    dom.zoom_fit.addEventListener("click", fitZoom);
    dom.close_paper.addEventListener("click", () => { dom.papers.classList.remove("open"); dom.paper_detail.setAttribute("aria-hidden", "true"); });
    dom.paper_search.addEventListener("input", renderPaperShelf);
    dom.import_research.addEventListener("change", event => importResearch([...event.target.files]));
    dom.export_notebook.addEventListener("click", exportNotebook);
    dom.ink_canvas.addEventListener("pointerdown", beginInk);
    dom.ink_canvas.addEventListener("pointermove", moveInk);
    dom.ink_canvas.addEventListener("pointerup", endInk);
    dom.ink_canvas.addEventListener("pointercancel", endInk);
    window.addEventListener("resize", () => { if (zoom < .7) fitZoom(); });

    rebuildIndexes(); loadStoredState(); renderNotebook(); requestAnimationFrame(fitZoom);
  </script>
</body>
</html>
